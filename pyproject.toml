[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "track_veil"
version = "0.4.6"
description = "Anonymizing track data sets for sharing."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "autojudge-base>=0.4.6",
    "click",
    "pandas",
    "numpy",
    "pydantic>=2.0",
    "PyYAML",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0,<9",
]
# Corpus archive builders (track-veil-docs build-corpus ...)
duckdb = [
    "duckdb",
]
routir = [
    "routir",
]

[project.scripts]
track-veil = "track_veil_lib.anonymizer.cli:main"
track-veil-docs = "track_veil_lib.documents.cli:main"

[project.urls]
Homepage = "https://github.com/trec-auto-judge/track_veil"
# "Bug Tracker" = "https://github.com/trec-auto-judge/auto-judge-code/issues"

[tool.hatch.build.targets.wheel]
packages = ["track_veil_lib"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E203"]
