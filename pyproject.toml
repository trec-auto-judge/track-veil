[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "track_veil"
dynamic = ["version"]
description = "Anonymizing track data sets for sharing."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "autojudge-base>=0.4.5",
    "click",
    "pandas",
    "numpy",
    "pydantic>=2.0",
    "PyYAML",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0,<9",
]
# Corpus archive builders (track-veil-docs build-corpus ...)
duckdb = [
    "duckdb",
]
routir = [
    "routir",
]

# DEV ONLY - resolve autojudge-base from the sibling checkout instead of PyPI.
#
# Needed while track-veil depends on unreleased autojudge-base changes (e.g.
# Leaderboard.write(format="jsonl")). Without this, `uv run` re-syncs from
# uv.lock and silently replaces any manual `uv pip install -e` with the PyPI
# wheel - and because the local version is also 0.4.5, uv treats the requirement
# as already satisfied and the editable install appears to do nothing.
#
# REMOVE (or repoint) BEFORE RELEASE, once the required autojudge-base is
# published and `dependencies` names that version. Assumes track-veil and
# auto-judge-code-test are siblings. Ignored when track-veil is consumed as a
# dependency, so it cannot leak into a published artifact.
[tool.uv.sources]
autojudge-base = { path = "../auto-judge-code-test/auto-judge-base", editable = true }

[project.scripts]
track-veil = "track_veil_lib.anonymizer.cli:main"
track-veil-docs = "track_veil_lib.documents.cli:main"

[project.urls]
Homepage = "https://github.com/trec-auto-judge/track_veil"
# "Bug Tracker" = "https://github.com/trec-auto-judge/auto-judge-code/issues"

[tool.hatch.version]
path = "track_veil_lib/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["track_veil_lib"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E203"]
